<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>USD Web Viewer</title>
    <style>
      :root {
        color-scheme: light;
        --bg0: #0f1012;
        --bg1: #1e2127;
        --fg: #f3f4f6;
        --accent: #7cd7ff;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at 20% 20%, #25303a 0%, var(--bg0) 70%);
        color: var(--fg);
        font-family: "Segoe UI", sans-serif;
      }

      #viewport {
        width: 100vw;
        height: 100vh;
      }

      #status {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(20, 22, 26, 0.78);
        border: 1px solid rgba(124, 215, 255, 0.2);
        font-size: 13px;
        backdrop-filter: blur(8px);
      }

      #status code {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="status">Loading: <code><span id="model-name"></span></code></div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const modelName = __MODEL_NAME_JSON__;
      const meshData = __MESH_DATA_JSON__;
      const status = document.getElementById("status");
      const modelNameEl = document.getElementById("model-name");
      const canvas = document.getElementById("viewport");

      modelNameEl.textContent = modelName;

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1d23);

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 10000);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2a2a, 0.85));
      const keyLight = new THREE.DirectionalLight(0xffffff, 1.15);
      keyLight.position.set(3, 5, 4);
      scene.add(keyLight);

      const group = new THREE.Group();
      try {
        for (const m of meshData) {
          const geo = new THREE.BufferGeometry();
          geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(m.positions), 3));
          if (m.normals) {
            geo.setAttribute("normal", new THREE.BufferAttribute(new Float32Array(m.normals), 3));
          }
          if (m.colors) {
            geo.setAttribute("color", new THREE.BufferAttribute(new Float32Array(m.colors), 3));
          }
          geo.setIndex(new THREE.BufferAttribute(new Uint32Array(m.indices), 1));
          if (!m.normals) geo.computeVertexNormals();
          const color = m.color
            ? new THREE.Color(m.color[0], m.color[1], m.color[2])
            : new THREE.Color(0.7, 0.7, 0.7);
          group.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, vertexColors: !!m.colors, side: THREE.DoubleSide })));
        }
        scene.add(group);
        fitCameraToObject(camera, controls, group);
        status.textContent = "Loaded: " + modelName;
      } catch (error) {
        status.textContent = "Error: " + error.message;
        console.error(error);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function fitCameraToObject(cam, orbit, object) {
        const box = new THREE.Box3().setFromObject(object);
        if (box.isEmpty()) {
          cam.position.set(2, 2, 3);
          orbit.update();
          return;
        }
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxSize = Math.max(size.x, size.y, size.z);
        const fitDistance = maxSize / (2 * Math.tan((Math.PI * cam.fov) / 360));
        const direction = new THREE.Vector3(1, 0.75, 1).normalize();
        cam.position.copy(center).addScaledVector(direction, fitDistance * 1.4);
        cam.near = Math.max(fitDistance / 100, 0.001);
        cam.far = Math.max(fitDistance * 100, 1000);
        cam.updateProjectionMatrix();
        orbit.target.copy(center);
        orbit.update();
      }

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
